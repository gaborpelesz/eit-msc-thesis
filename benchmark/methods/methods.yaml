        alternate up to three times within one image pass and prior_build spans
        must carry level=0|1|2. Per-scale timing tables cannot be filled from
        the host for this method the way they can for ACMM.
      - >-
        The repository contains three trees; only HPM-MVS/HPM-MVS is built.
        HPM-MVS/ACMM+NESP is a complete but unbuilt Windows ablation tree and
        must not be mistaken for the measured method.
      - >-
        The shipped converter lives in the unbuilt ablation tree, not next to
        the built sources.
      - >-
        Its .gitignore sits at HPM-MVS/.gitignore rather than the repo root.
      - >-
        GetDisparity (HPM.cpp:458) is static and has no callers; the fork's
        point3D index fix is latent-UB only and changes no output.
