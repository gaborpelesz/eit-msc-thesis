  - name: HPM-MVS_plusplus
    path: benchmark/methods/HPM-MVS_plusplus
    upstream: https://github.com/CLinvx/HPM-MVS_plusplus
    upstream_default_branch: main
    upstream_base: 946bebdba367c567a4b64220d4d7e8622cdc3a05
    provenance: published-reference
    paper: hpm_plusplus_tpami2026.pdf
    source_subdir: .
    executable: build/HPM-MVS_plusplus
    invocation: ["{executable}", "{dataset_dir}", "--no-debug-output"]
    invocation_optional_args: ["{use_sky_mask}"]
    converter: colmap2mvsnet_acm.py
    output_ply: HPM_MVS_plusplus/HPM_MVS_plusplus.ply
    requires_equal_image_sizes: false
    fork_sha: null
    passes:
      photometric: photometric
      hierarchy: hierarchy
      prior_consistency: prior
      geom: geometric
      multi-geometry: multi_geometric
      mand_consistency: mandatory
    known_limitations:
      - >-
        Known host memory leak: plane_hypotheses_host / costs_host are new[]'d
        and the delete is commented out (HPM.cpp:563-570). The v0 harness
        already records "can run into segfault in CUDA because of memory leak,
        but possible to run with lower scale" (eval.py:115). Memory-phase data
        from this method must be read with the leak in mind.
      - >-
        The most expensive schedule in the set: 18 image passes per image plus
        12 whole-dataset ConfidenceEvaluation sweeps (main.cpp:782-932), each a
        pure-host pass that reads and rewrites every .dmb in the scene. Very
        likely the dominant hidden cost; it has no counterpart in any other
        method and must be timed as its own top-level phase.
      - >-
        Runs cv::Canny on the host inside every ProcessProblem and writes one
        or two triangulation*.png per prior pass.
      - >-
        Optional second argument selects RunFusion_Sky_Strict, which needs
        external sky-segmentation masks at <dense>/masks/%08d.jpg from an
        unspecified model. The harness never passes it; sky filtering is off in
        both configurations.
      - >-
        The confidence.dmb filename-casing repair (HPM.cpp:885) is the one fork
        deviation that changes the numbers a Linux build produces: without it
        readDepthDmb fails and an uninitialised confidence buffer is uploaded
        to the device. HPM-MVS++ cannot be run faithfully on Linux without it.
      - >-
        A second PLY, HPM_MVS_plusplus/HPM_MVS_plusplus_mask.ply, is produced
        in mask mode only.
      - >-
        Median-filter kernels are defined but never launched.
    harness_deviations:
      - class: normalization
        description: "norm10 only: shared colmap2mvsnet_acm_perf instead of the fork's converter; author runs the fork's own."
        reversible: configuration author
        affects: quality
      - class: normalization
        description: "norm10: converter emits 10 source views instead of the shipped 20."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: normalization
        description: >-
          Debug artefact output disabled in both configurations by passing
          --no-debug-output (R-EXP-11). The fork's own default is the upstream
          behaviour; see global_deviations for what each method writes.
        reversible: flag --no-debug-output
        affects: timing,io

  - name: MP-MVS
    path: benchmark/methods/MP-MVS
    upstream: https://github.com/RongxuanTan/MP-MVS
    upstream_default_branch: main
    upstream_base: 17e3c05e9706ce9735e466756492f9967238afff
    provenance: published-reference
    paper: mp_mvs.pdf
    source_subdir: .
    executable: build/MPMVS
    invocation: ["{executable}", "{dataset_dir}", "{config}", "--no-debug-output"]
    config_path: /sota/MP-MVS/config/config.yaml
    converter: colmap2mvsnet_acm.py
    output_ply: MP_MVS/MPMVS_model.ply
    requires_equal_image_sizes: false
    fork_sha: null
    passes:
      photometric: photometric
      planar_prior: prior
      geom_planar_prior: prior
      geom: geometric
    known_limitations:
      - >-
        The only method with a config file. It is the optional second argument
        (`MPMVS <dense_folder> [config_yaml]`); with no second argument the
        binary reads config/config.yaml relative to the current working
        directory, so the harness always passes config_path explicitly. Only
        Input-folder and Output-folder are overridden by the dataset argument;
        every other parameter of the run comes from that file and must be
        captured in the run record.
      - >-
        The four debug switches in config/config.yaml (Save Dmb as JPG, Save
        Prior Dmb as JPG, Save Cost Map, Save Normal Map) are ON, as upstream
        ships them, so by default every run writes a JPEG per depth map, prior,
        cost map and normal map plus a copy of each depth map under
        <dense>/MP_MVS/save/, inside the measured region. Two further writes
        are unconditional in the per-image loop: costs.jpg per image pass and
        triangulation.png per prior pass. --no-debug-output overrides all six
        AFTER readConfig, so config.yaml stays exactly as released and its
        contents still go into the run record verbatim.
      - >-
        Upstream's released CMakeLists forces CMAKE_BUILD_TYPE=Debug; the fork
        removes it and the image builds Release. Correct for a benchmark, but a
        deviation from the method as released.
      - >-
        "Sky segment: 1" in config.yaml is inert. GenerateSkyRegionMask is
        behind #ifdef BUILD_NCNN and option(USE_NCNN ... OFF), so no ncnn is
        built and no sky masks are produced. The config advertises a feature
        the binary does not contain.
      - >-
        Multi-scale is inside the kernel loop (PatchMatch.cu:1223-1235) at one
        fixed resolution and only on the photometric path, so the canonical
        `scale` phase is N/A on the host for this method. Per-scale rows must
        be blank, never zero; the phase trace instead carries scale= on
        patchmatch.propagate, which is where the loop actually is. `scene_scan`
        is likewise absent: MP-MVS reads config.yaml where the others inspect
        the images (D21, judgment call 12).
      - >-
        Output directory is MP_MVS (fork-renamed from upstream's MPMVS); the
        harness depends on it.
      - >-
        Its own Time class (gettimeofday) covers only the two ProcessProblem
        loops - not config read, pair list, sky filter, fusion or PLY write.
      - >-
        Fusion is single-threaded.
      - >-
        OpenCVConfig.cmake still calls find_package(CUDA), so FindCUDA and its
        cuda_add_executable macro remain in scope even though the fork does not
        use either; CMake warns that policy CMP0146 is unset. Harmless while the
        target is created with add_executable, but the fork's CMakeLists must
        not be edited back onto the FindCUDA path.
    harness_deviations:
      - class: normalization
        description: "norm10 only: shared colmap2mvsnet_acm_perf instead of the fork's converter; author runs the fork's own."
        reversible: configuration author
        affects: quality
      - class: normalization
        description: "norm10: converter emits 10 source views instead of the shipped 20."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: interface
        description: >-
          The harness supplies the config file location as the second argument
          ({config} -> config_path). Recorded here because the choice of which
          config file a run uses lives in the harness, not in the fork, and the
          parameters in it belong in the run record.
        reversible: no
        affects: none
      - class: normalization
        description: >-
          Debug artefact output disabled in both configurations by passing
          --no-debug-output (R-EXP-11). The fork's own default is the upstream
          behaviour; see global_deviations for what each method writes.
        reversible: flag --no-debug-output
        affects: timing,io

  - name: DPE-MVS
    path: benchmark/methods/DPE-MVS
    upstream: https://github.com/M3phist0/DPE-MVS
    upstream_default_branch: main
    upstream_base: e1ff7e3db12d83b2b8685beef1055b6de5801505
    provenance: published-reference
    paper: dpe.pdf
    source_subdir: DPE-MVS
    executable: DPE-MVS/build/DPE
    invocation: ["{executable}", "{dataset_dir}", "--no-debug-output"]
    invocation_optional_args: ["{gpu_index}"]
    converter: DPE-MVS/colmap2mvsnet.py
