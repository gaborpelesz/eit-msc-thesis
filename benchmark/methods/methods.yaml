      - >-
        Hard requirement, enforced: CheckImages() aborts unless every image has
        identical width and height. Under `author` the fork's own converter
        pads; under `norm10` the campaign prefers scenes needing no padding,
        else pads every method (R-EXP-09).
      - >-
        show_medium_result defaults to TRUE (main.h:110) - unlike APD-MVS,
        where it is false. DPE therefore writes depth_N.jpg, normal_N.jpg and
        weak_N.jpg per problem per iteration and a point_N.ply every fourth
        iteration. That is upstream behaviour and stays on by default, but it
        is a large timing asymmetry against the other methods and belongs under
        the shared --no-debug-output flag.
      - >-
        Upstream ships DEBUG_COMPLEX enabled (DPE.cu:3), copying a
        full-resolution buffer device->host and encoding complex.jpg on every
        RunPatchMatch. The #define is left defined and the block is guarded at
        run time by --no-debug-output, so the compile-time switch keeps its own
        meaning: undefined removes the code, defined without the flag is
        upstream behaviour, defined with the flag skips the write.
      - >-
        No deep-learning model. "ES" is classical CV computed in-binary
        (Roberts, union-find, HoughLinesP or adaptive-median Canny).
      - >-
        Repository contains an unbuilt "ACM. + ES" tree with three standalone
        ablation programs (ACMM/ACMP/ACMMP + ES). They are NOT a preprocessing
        stage for DPE and must not be instrumented.
      - >-
        Upstream has 3 later commits (README + 2 PNGs); no code drift. Not
        rebased.
      - >-
        The Dockerfile copies only the DPE-MVS/ subdirectory into the image, so
        the container does not contain the ablation tree.
      - >-
        Published parameter symbols could not be mapped to code; only eta = 4
        <-> robthr = 4 is plausible (param-survey § F.2).
      - >-
        CUDA_SEPARABLE_COMPILATION ON was added by the fork and was never
        requested upstream.
    harness_deviations:
      - class: normalization
        description: >-
          norm10 only: shared colmap2mvsnet_acm_perf (with --padding if the
          scene needs it, then for every method) instead of the fork's own
          converter, which pads AND re-encodes AND optionally rescales. author
          runs the fork's own converter.
        reversible: configuration author
        affects: quality
      - class: normalization
        description: >-
          Zero-padding of every image to the scene maximum, required by
