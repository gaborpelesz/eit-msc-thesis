        reversible: flag --padding
        affects: quality,timing
      - class: normalization
        description: "norm10: converter emits 10 source views instead of the shipped 20."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: normalization
        description: >-
          Debug artefact output disabled in both configurations by passing
          --no-debug-output (R-EXP-11). The fork's own default is the upstream
          behaviour; see global_deviations for what each method writes.
        reversible: flag --no-debug-output
        affects: timing,io

  - name: TSAR-MVS
    path: benchmark/methods/TSAR-MVS
    upstream: https://github.com/ZhenlongYuan/TSAR-MVS
    upstream_default_branch: main
    upstream_base: 1e0a6d611b3b4a7099dc2aab1f570f458d7a3db3
    provenance: published-reference
    provenance_note: >-
      Yuan, Cao, Wang and Li, Pattern Recognition 154 (2024) 110565; the same
      first author as DVP-MVS and MSP-MVS. Not an ACM-lineage method: it is a
      fork of Gipuma (kysucix/gipuma) with gSLICr and ORUtils vendored in, and
      it is not a stand-alone reconstruction method at all - it is a
      REFINEMENT STAGE that reads a base method's depth and normal maps and
      rewrites them ("a universal algorithm that can be extended to most MVS
      methods", its README). DVP-MVS's release contains a "simplified TSAR-MVS
      version" (F-018), so this is that code's ancestor.
    paper: tsar_2308.09990v4.pdf
    status: excluded
    reason: >-
      Excluded from the campaign by decision D30 (author, 2026-09-07), as
      DVP-MVS was by D19-b. Added to the manifest on 2026-09-07 for provenance
      and for the lineage chapter; it is the collection's only Gipuma-branch
      member and DVP-MVS's ancestor (same first author). The release cannot
      produce a point cloud on any platform without two Windows binaries that
      ship WITHOUT SOURCE - `Fusion.exe` (the fusion stage; no fusion source
      exists in the repository) and `data/TRAIN/APD.exe` (a modified APD-MVS,
      which is what writes the `depths_geom.dmb` and `weak.png` files the
      matcher reads, under names no released APD-MVS or ACM-family binary
      produces) - and the paper's first contribution, the three-term
      confidence, is commented out in the shipped matcher source (F-029 and
      the apde-tsar-lineage survey). Measuring it would mean reconstructing a
      pipeline the authors did not publish, on a base the paper never used.
      The fork stays pristine at upstream-base; `deviations verify` enforces
      zero own commits and `bench run` refuses to name it. It is used as an
      RQ4 case study, alongside DVP-MVS, in the thesis. Everything below is
      read off the pristine fork, not measured.
    source_subdir: .
    executable: build/gipuma
    invocation: []
    converter: null
    output_ply: null
    requires_equal_image_sizes: null   # not determined; per-reference invocation with one K per camera, never tested on mixed sizes
    fork_sha: null
    passes: {}
    known_limitations:
      - >-
        NOT A STAND-ALONE METHOD. `main()` (main.cpp:1871-1896) runs weak
        texture detection, gSLICr superpixel segmentation and then
        `runGipuma`, which at main.cpp:1457-1476 reads
        `<mslp_folder>/APD/<image id>/depths_geom.dmb` and `normals.dmb` as
        its starting hypotheses, plus `<...>/weak.png` (main.cpp:1499). It
        refines those and writes `TSAR_disp.dmb`, `TSAR_normals.dmb`,
        `TSAR_normals.png` and `TSAR_results.txt`. There is no PatchMatch
        initialisation from scratch and no fusion: the depth maps of a base
        method are the input, and their runtime is therefore not this method's
        runtime. Any comparison would be `base + TSAR`, with the base named.
      - >-
        BLOCKER 1 - the base method's binary is not published. Upstream
        APD-MVS (`upstream-base` 95be7c9, main.cpp:117-133, 223-225) writes
        `depths.dmb`, `normals.dmb`, `weak.bin` and debug `weak_<i>.jpg`, and
        DELETES the three .dmb/.bin files after fusion; `depths_geom.dmb` is
        the ACM-family name (cf. ACMMP main.cpp:244) and no ACM-family binary
        writes a weak map at all. So no released base method produces the three
        files TSAR-MVS reads. What does produce them is the committed
        `data/TRAIN/APD.exe`, a Windows binary of a modified APD-MVS with no
        source in the repository (and `data/TRAIN/delete.py`, which prunes an
        `APD/` output tree, keeping the .ply files).
      - >-
        BLOCKER 2 - the fusion stage is not published. `x/*.sh` (13 ETH3D
        scene scripts) invoke `./Fusion <mslp_folder> --num_consistent=
        --reproj_error= --depth_diff= --angle= --used_list=`; the only
        `Fusion` in the repository is `Fusion.exe`, a Windows binary. No
        fusion source exists (`grep -rl Fusion *.cpp *.cu *.h` is empty). The
        README points at the external `kysucix/fusibile` instead, which is
        Gipuma's companion, not the authors' modified binary, so substituting
        it would measure a different fusion than the paper's.
      - >-
        BLOCKER 3 - no converter, no documented input format, and the one input
        the CLI names is never opened. `-krt_file` (the scripts pass
        `images/dinoSR_par.txt`, a name inherited from Gipuma's Middlebury
        example) serves only as the non-empty sentinel that selects the branch
        at cameraGeometryUtils.h:234: readKRtFileMiddlebury (declared
        fileIoUtils.h:111) ignores its `filename` parameter entirely and reads
        `<mslp_folder>/cams/<i>_cam.txt` (MVSNet format) instead - and, taking
        the camera vector BY VALUE, discards everything it parses except
        depthMin / depthMax, so every camera keeps the identity projection
        matrix (F-033). `<mslp_folder>/pair.txt` is read at
        main.cpp:1352-1376. Nothing in the repository converts ETH3D or COLMAP
        into that mixture, and no converter could supply the krt file, because
        nothing reads it.
      - >-
        Invocation shape is incompatible with the harness's one-process-per-run
        model: the authors' scripts (`scripts/*.sh`, `x/*.sh`) loop over the
        scene's images and start one `gipuma` process per reference image, with
        the full image list as positional arguments and the reference first
        (main.cpp:762-765 collects every non-`-` argv as an image name); view
        selection then maps pair.txt image ids onto argv positions
        (main.cpp:1352-1376). `invocation` is left empty here because the
        harness cannot express that argv, and inventing one would imply
        the method can be run.
      - >-
        The scripts pass `--min_angle=$min_angle --max_angle=$max_angle` with
        both variables UNSET (e.g. scripts/office.sh:44), i.e. literally
        `--min_angle= --max_angle=`, and `./Fusion` likewise receives
        `--num_consistent= 1` as two argv tokens. The released scripts do not
        run as written.
      - >-
        Build (`build`, would be needed): `cuda_add_executable`
        (CMakeLists.txt:84). The hardcoded
        `-gencode arch=compute_52,code=sm_52` at CMakeLists.txt:37 is set in
        CMAKE_CUDA_FLAGS, which FindCUDA's cuda_add_executable and
        cuda_add_library never read - they read CUDA_NVCC_FLAGS - so the line
        is INERT and the released tree builds at nvcc's default architecture,
        which under CUDA 12.8 is sm_52 SASS plus compute_52 PTX that the driver
        JITs on a newer GPU (F-035, correcting the earlier reading that the
        binary was pinned to Maxwell SASS with no PTX). What remains true is
        that the architecture cannot be chosen: -DCMAKE_CUDA_ARCHITECTURES has
        no effect either, and only gSLICr gets an architecture on purpose,
        through the one mechanism FindCUDA does honour - `OPTIONS -gencode
        arch=compute_52,code=compute_52` (PTX only, CMakeLists.txt:77).
        `-march=native` is set unconditionally for every non-MSVC build
        (CMakeLists.txt:11), and again in the release flags (:45), not only
        under GNUCXX as in the ACM forks, so a fleet binary would be
        host-specific. CUDA 6.0 / OpenCV 2.4 era code with
        `CMAKE_CUDA_STANDARD 11`.
      - >-
        The paper's first contribution is disabled in the released source. The
        three-term confidence of Eq. (1) is commented out at gipuma.cu:1200 and
        the live line 1201 computes only two of its three terms (it drops the
        min / second-min ratio); the `n_aggr > eta` gate that would use it,
        with the paper's eta = 0.8, is commented out at gipuma.cu:1204-1206, so
        the confidence is computed and then never used to reject anything
        (F-045). This is the same pattern as DVP-MVS, whose depth-edge prior is
        commented out in its release (F-018) - and DVP-MVS descends from this
        code, which makes it a three-release pattern with one first author.
      - >-
        The repository ships build detritus and undistributable artefacts:
        `gipuma.exe`, `Fusion.exe`, `data/TRAIN/APD.exe`, an MSVC
        `out/build/x64-Debug/` tree, and `data/使用守则.docx`. `main.cpp` and
        `gipuma.cu` are ISO-8859/GBK, not UTF-8 (`file` reports "ISO-8859
        text"), so UTF-8 tooling treats them as binary - `grep` skips them
        unless forced with `-a`.
      - >-
        `readDepthDmb` / `readNormalDmb` results are used without checking
        (main.cpp:1474-1489 indexes `ref_normal(y, x)` immediately), so a
        missing base-method depth map is a crash, not a diagnostic.
      - >-
        Its stage vocabulary does not map onto `canonical_passes`, which was
        derived from the ten campaign methods: TSAR-MVS runs weak-texture
        detection, superpixel generation, an upsampling PatchMatch, a
        disparity-continuity pass and a large-textureless-area RANSAC
        (main.cpp:373, 599, 1492, 1495, 1519). `passes` is therefore empty
        rather than forced into names that would misdescribe it.
      - >-
        Fork is pristine at upstream main (2025-10-05, "Update README.md");
        upstream carries no tags and no release. Its history includes
        `Delete =`, `Delete 10]` and `Delete 参数.txt`, i.e. accidental
        uploads.
    harness_deviations: []

  - name: DVP-MVS
    path: benchmark/methods/DVP-MVS
    upstream: https://github.com/ZhenlongYuan/DVP-MVS
    upstream_default_branch: main
    upstream_base: 5b2b31c02941cfa28808b4e37f06a87e8dc0f2d9
    provenance: published-reference
    paper: 2412.11578v1.pdf
    status: excluded
    reason: >-
      Dropped from the measurement campaign: the release does not implement the
      paper. It requires three input folders nothing in the repository
      produces - <dense>/dep/*.dmb (Depth-Anything-V2 monocular depth, inverted
      as 255-dep), <dense>/sfm/*.txt and <dense>/MVS4/*.dmb - with no
      checkpoint named, no inference script and no documented export
      convention, so the authors' configuration cannot be reconstructed. Its
      main loop also stops one round early (main.cpp:450), so the finest scale
      is never reached and the output is always at least 2x downsampled;
      CheckImages() is commented out; label_host is left uninitialised on the
      normal path before being cudaMemcpy'd as int (a latent crash). The fork
      stays PRISTINE at upstream/main - zero commits after upstream-base - and
      `deviations verify` enforces that. It is documented in the thesis as an
      excluded method, not measured.
    source_subdir: .
    executable: build/APD
    invocation: ["{executable}", "{dataset_dir}"]
    invocation_optional_args: ["{gpu_index}"]
    converter: colmap2mvsnet.py
    output_ply: APD/APD.ply
    requires_equal_image_sizes: null   # CheckImages() is commented out upstream; would have to be determined empirically
    fork_sha: null
    passes:
      FIRST_INIT: init
      REFINE_INIT: refine
      REFINE_ITER: geometric
    known_limitations:
      - Not built by the Dockerfile and not present in the v0 harness.
      - >-
        CMakeLists.txt:9 hardcodes a Windows OpenCV_DIR (E:/opencv-4.2.0/...),
        depends on Boost.Filesystem (not in the image), targets sm_80 through
        cuda_add_executable, and requires -std=c++11 under CUDA 12.8/clang-18.
      - >-
        main.cpp:31 contains a hardcoded debug condition
        (ref_image_id == 93 && iteration == 13). Upstream; left as is.
      - >-
        Its converter is byte-identical to APD-MVS's (variant D) and still
        calls np.asscalar, removed in NumPy 1.23.
      - >-
        Would need a preprocess.mono_depth phase that no other method needs;
        the README does not say whether the paper's runtimes include inference.
    harness_deviations: []

  - name: CUMVS
    path: benchmark/methods/cuda-multi-view-stereo
    upstream: https://github.com/fixstars/cuda-multi-view-stereo
    upstream_default_branch: main
    upstream_base: 2efda9410ced0806b8f0ee3735cd5f14a6d4c99f
    provenance: third-party-optimization
    provenance_note: >-
      NOT the thesis author's work. An external optimization effort by Fixstars
      Corporation, cited as prior art that optimization headroom exists in the
      ACM family. It must never be attributed to the author.
    paper: null
    source_subdir: .
    executable: build/samples/app_patch_match_mvs
    invocation: ["{executable}", "{dataset_dir}", "--output-directory={output_dir}"]
    converter: null
    initializer: build/samples/app_initialize_ETH3D
    initializer_invocation: ["{initializer}", "{raw_scene_dir}", "--output-directory={dataset_dir}"]
    output_ply: CUMVS/point_cloud_dense.ply
    requires_equal_image_sizes: false
    fork_sha: null
    passes:
      photometric: photometric
      geometric: geometric
    known_limitations:
      - >-
        Does not use any colmap2mvsnet converter. Its own C++
        app_initialize_ETH3D consumes the raw
        <scene>_dslr_undistorted/<scene> folder, does its own O(N^2) view
        selection (track-id intersection, 75th-percentile triangulation angle
        >= 1 degree, top 20) and writes input_images.json, global_poses.json,
        view_id_sets.json and point_cloud_sparse.ply. Images are not copied;
        decode and rescale happen inside the main binary. The `norm10`
        neighbour count therefore reaches CUMVS through --max-neighbors, not
        through the shared converter.
      - >-
        Comparability: --max-image-size defaults to 3200 and --max-neighbors to
        20. These are the two knobs that must be aligned with the other
        methods' effective settings, and the alignment lives here in the
        manifest, not in the fork.
      - >-
        Does not fit the per-image I/O model at all: no .dmb round trip, one
        global input_load, no fusion.load, no prior_build, no
        patchmatch.finalize, no depthmap_write, no result_readback (the
        download IS patchmatch.readback) and no device_init (no cudaSetDevice;
        the CUDA context is created lazily and its cost lands in the first
        device_upload). Those phases are absent from its trace and must be
        reported N/A, never folded into patchmatch - hiding them would hide the
        effect being measured. Its `upsample` is a nearest-neighbour
        cv::resize, not a joint bilateral upsampling, and its `fusion` has no
        separable load stage, so fusion == fusion.consistency for this method.
      - >-
        The only method with kernel launches not followed by a synchronise
        (initializeDepthsAndNormalsKernel, calcInitialCostsKernel), so a small
        amount of time is attributed to the following phase.
      - >-
        Requires OpenCV built with viz (VTK + Qt5) for writeCloud.
      - >-
        Upstream has exactly one commit on main; upstream_base coincides with
        upstream's 1.0.0 tag. The whole fork-vs-upstream diff is 8 added lines.
      - >-
        Its README reports ETH3D totals (ACMM 12277.7 s vs CUMVS 2140.4 s) but
        never states whether app_initialize_ETH3D is included. Inferred to be
        excluded.
      - >-
        Its OpenCV CommandLineParser rejects unrecognised keys, so the shared
        --no-debug-output flag must not be passed to it. It writes no debug
        artefacts unless -d/--debug is given, which the harness never passes.
    harness_deviations:
      - class: interface
        description: >-
          Preprocessing is app_initialize_ETH3D rather than the shared
          converter, because CUMVS consumes a different input format entirely.
          Both do view selection and both are excluded from the measured
          region, which is comparable - but it must be stated, not assumed.
        reversible: no
        affects: none
      - class: normalization
        description: >-
          "norm10: --max-neighbors=10 passed to app_initialize_ETH3D (the
          shipped value is 20), the CUMVS-side equivalent of the shared
          converter's neighbour count."
        reversible: flag --max-neighbors=20
        affects: timing,memory,quality
      - class: normalization
        description: >-
          R-EXP-11 (debug artefact output off) needs no action for this method:
          it writes no debug artefacts. The harness must NOT pass
          --no-debug-output to it -- the binary has no such flag.
        reversible: no
        affects: none

  - name: quorum-mvs
    path: benchmark/methods/quorum-mvs
    # Not a fork. There is no upstream to deviate from, so there is no
    # `upstream-base` tag and no commit range to read trailers out of; what
    # takes their place is this entry and the submodule gitlink, both checked
    # by `deviations verify`.
    upstream: null
    upstream_default_branch: null
    upstream_base: null
    provenance: own
    provenance_note: >-
      The thesis author's own method, written for this thesis. It is not a fork
      or an optimization of any of the twelve published references, and it is
      not CUMVS's line of work either - CUMVS is a third-party optimization of
      the ACM family and must never be attributed to the author. Where this
      method takes a mechanism from the lineage it names the file and symbol it
      took it from, in its own docs/. Its repository is PRIVATE, so
      `git clone --recursive` fails on it for anyone without access; the
      failure is benign and every other method still checks out.
    paper: null
    source_subdir: .
    executable: build/src/quorum-mvs
    # The configuration every existing number was measured at, read off the run
    # records rather than retyped from prose: --size-bound 500 --levels 4
    # --geom-passes 2 --use-prior on --prior-position acmmp --prior-iterations 5
    # --num-source-views 20 --sampling adaptive --patch-scales 2. --seed and
    # --device are required arguments with no defaults; the seed is the run's
    # repeat index, so repeats 1..N draw seeds 1..N.
    invocation: ["{executable}", "{dataset_dir}",
                 "--seed", "{repeat}",
                 "--device", "{gpu_index}",
                 "--num-source-views", "20",
                 "--size-bound", "500",
                 "--levels", "4",
                 "--geom-passes", "2",
                 "--use-prior", "on",
                 "--prior-position", "acmmp",
                 "--prior-iterations", "5",
                 "--sampling", "adaptive",
                 "--patch-scales", "2",
                 "--with-colour",
                 "--output", "{dataset_dir}/quorum-mvs_model.ply"]
    converter: null
    converter_source: shared
    output_ply: quorum-mvs_model.ply
    requires_equal_image_sizes: false
    fork_sha: null
    # Its own vocabulary is ACMMP's, by construction: src/pipeline/schedule.cpp
    # sets PassPlan::trace_name to exactly these five strings so that a phase
    # trace tagged `pass=` is comparable with the ten measured forks without a
    # second mapping.
    passes:
      photometric: photometric
      hierarchy: hierarchy
      planar_prior: prior
      geom: geometric
      multi-geometry: multi_geometric
    known_limitations:
      - >-
        NOT BUILT BY benchmark/Dockerfile. The image builds the thirteen forks
        and not this method, so `bench run` cannot execute it yet; `bench plan`
        and `deviations verify` are unaffected. Adding this entry also makes
        every existing image's build manifest differ from the working tree's by
        one method, so D24.1 will refuse EVERY `bench run`, whatever it names,
        until the Dockerfile builds this method and the image is rebuilt with a
        regenerated image-manifest.json.
      - >-
        The pinned submodule SHA predates the rename from the method's former
        name: at that commit the CMake project, the executable target and the
        default --output path still carry it. `executable` and the --output
        token above are written to the agreed names and become true when the
        submodule is bumped past the rename.
      - >-
        The cloud is written to the ROOT of the prepared folder rather than to
        a subdirectory of it, unlike every other method. src/io/ply.cpp opens
        the path with std::fopen and creates no parent directory, and the
        binary's own default (<dense>/<name>/<name>_model.ply) therefore names
        a directory nothing creates. `output_ply` and the --output token name
        the same file and nothing in the harness makes them; the test
        `test_own_method_entry.py` is what keeps them in step.
      - >-
        The binary's own defaults are not the measured configuration: the
        shipped --num-source-views is 10, --levels 1, --geom-passes 0,
        --use-prior off, --size-bound 1000 (ACMMP's), --sampling acmmp and
        --patch-scales 0. The invocation above is the operating point the
        author selected by measurement, and it is what the manifest, not the
        binary, defines.
      - >-
        It writes its own run record (--run-json, defaulting to the --output
        path with a .json suffix) beside the cloud in the scratch tree, which
        the runner removes unless `keep_intermediates: true`. Nothing in the
        harness collects it, so the method's own view of a run - its resolved
        schedule, budget and per-phase counters - is not currently kept.
      - >-
        Its phase trace opens one span, `run`, that is not in
        `canonical_phases`; every other name it emits is
        (src/timing/phase_recorder.cpp). Nothing validates phase names against
        that list, so the span is carried through and reported as-is.
      - >-
        src/timing/bench_timer.h is byte-identical to the header vendored into
        the ten campaign forks (md5 0000b6aa333034796d3a0d22c6a0598f, verified
        against ACMH's and ACMMP's copies at the SHAs pinned here), so its
        phase boundaries are produced by the same code as theirs.
      - >-
        Its argument parser rejects an unrecognised flag
        (ConfigErrorKind::unknown_flag), so the shared --no-debug-output must
        not be passed to it. It has no debug-artefact path to disable: the run
        fails if the timed region opens any file for writing at all
        (src/app/main.cpp, the writable-descriptor check around the timed
        seam).
    harness_deviations:
      - class: normalization
        description: >-
          `--with-colour` is passed in every configuration. The five published
          methods measured alongside it write red/green/blue as part of fusion,
          so their clouds carry colour and theirs is the cost of producing it;
          this method's fusion emits geometry only and reads colour back on the
          host in a separate pass, which is off by default. Left off, it would
          be doing strictly less work than the methods it is timed against, and
          the comparison would favour it for a reason that has nothing to do
          with the algorithm. Measured cost of the pass: delivery_area 228.136 s
          with against 228.493 s without (inside the 0.000058 F1 seed noise band
          for this configuration, i.e. not resolvable), pipes 53.272 s against
          53.093 s. It also makes the clouds visually comparable, which the
          geometry-only output is not.
        affects: timing,io
        reversible: flag omit --with-colour
      - class: interface
        description: >-
          IT SHIPS NO CONVERTER. The shared colmap2mvsnet_acm_perf prepares its
          input in BOTH configurations, `author` included, which no other
          method's `author` does - every other method runs its own converter
          there and only `norm10` substitutes the shared one. Its `author`
          input is therefore byte-comparable with the ACM-lineage methods'
          (whose shipped converters are view-selection-identical to the shared
          one) but NOT with APD-MVS's or DPE-MVS's, whose own converters pad,
          re-encode and optionally rescale. Declared as
          `converter_source: shared`.
        reversible: no
        affects: quality
      - class: normalization
        description: >-
          --num-source-views 20 in every configuration, against a shipped
          default of 10. 20 is what every other method's own converter emits
          under `author`, so this equalises the view budget with the baselines
          it is compared against; the value is a run-time flag, not a rebuild.
        reversible: flag --num-source-views 10
        affects: timing,memory,quality
      - class: normalization
        description: >-
          "norm10: the shared converter emits 10 source views instead of 20.
          Because the same converter also prepares this method's `author`
          input, its author->norm10 delta is a PURE view-count effect - the
          converter effect that confounds every other method's delta
          (param-survey § C) is absent here, which makes it the reference
          against which the others' confounding can be read."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: interface
        description: >-
          The harness supplies the seed. --seed is a required argument with no
          default, and the invocation passes the run's repeat index, so the
          repeats of one (method, scene, width, configuration) are independent
          draws rather than N re-measurements of one, and re-running the
          specification reproduces the same seeds.
        reversible: no
        affects: none
      - class: normalization
        description: >-
          R-EXP-11 (debug artefact output off) needs no action for this method:
          it writes no debug artefacts and the run fails if the timed region
          opens any file for writing. The harness must NOT pass
          --no-debug-output to it -- the binary rejects unknown flags.
        reversible: no
        affects: none
