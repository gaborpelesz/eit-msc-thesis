# benchmark/methods/methods.yaml
#
# SOURCE OF TRUTH for the benchmarking harness and for the deviation policy
# (`CLAUDE.md` § "Deviation policy", § "Source of truth"). Every fact the
# harness needs in order to build, invoke, and account for a method lives here:
# provenance, fork point, executable, invocation, output artefact, pass-name
# mapping, known limitations, and the deviations that live in the harness
# rather than in a fork.
#
# THIS FILE IS HAND-MAINTAINED. Four artefacts are GENERATED from it plus the
# forks' `git log upstream-base..HEAD`, by `uv run deviations render`, and MUST
# NEVER BE HAND-EDITED:
#
#   benchmark/methods/DEVIATIONS.md         per-method commit and harness tables
#   benchmark/methods/deviations.json       machine-readable; the same document
#                                           the harness embeds in every run
#                                           record and writes to each campaign
#                                           directory, except that the
#                                           checked-in copy leaves
#                                           `generated_at` null so a re-render
#                                           of an unchanged tree is byte-identical
#   thesis/generated/deviations.tex         appendix longtable, one row per commit
#   thesis/generated/methods-provenance.tex provenance and fork points
#
# Re-run `uv run deviations render` after any change here or in a fork.
#
# `deviations verify` reads this file and gates every benchmark run. A
# measurement produced while `verify` was failing may not be quoted.
#
# Provenance classes (CLAUDE.md):
#   published-reference     the authors' own release accompanying a paper
#   third-party-optimization an external, non-authorial optimization effort.
#                           CUMVS is this. It is NOT the thesis author's work.
#   own                     the thesis author's own reimplementation (none yet)
#
# Path conventions:
#   path            submodule path, relative to the repository root
#   source_subdir   directory inside the fork holding the CMakeLists.txt that
#                   the Dockerfile configures ("." when it is the fork root)
#   executable      built binary, relative to the FORK ROOT (i.e.
#                   <source_subdir>/build/<target>), as the Dockerfile produces
#                   it. The container mirrors the fork root at /sota/<name>.
#   converter       the converter script SHIPPED BY THE FORK, relative to the
#                   fork root. The `author` configuration runs it (pipeline as
#                   released); `norm10` substitutes the shared converter (see
#                   configurations and global_deviations).
#   converter_source `fork` (the default, and what `converter` above describes)
#                   or `shared`. `shared` says the method ships no converter at
#                   all, so the harness's colmap2mvsnet_acm_perf prepares its
#                   input in EVERY configuration, `author` included. That makes
#                   such a method's `author` unlike every other method's, and
#                   the asymmetry is declared as a harness deviation on the
#                   entry rather than left to be inferred from `converter:
#                   null` -- which CUMVS also has, for the unrelated reason
#                   that it preprocesses with a compiled initializer.
#   output_ply      produced point cloud, relative to the PREPARED dataset dir
#   invocation      argv template. Placeholders: {executable}, {dataset_dir},
#                   {output_dir}, {gpu_index}, {config}, {repeat}. {config}
#                   expands to the method's `config_path`; MP-MVS is the only
#                   method that takes one (see its known_limitations).
#                   {repeat} is the run's repeat index, 1-based, for a method
#                   whose RNG seed is a required argument: the repeats of a
#                   randomized method must not all draw the same seed.
#   fork_sha        null means "must equal the submodule's checked-out HEAD";
#                   a SHA pins the fork to an exact commit. Left null until the
#                   audit rewrite of the forks lands.
#
# All `upstream_base` SHAs, upstream URLs and default branches are cited from
# the fork audit: resources/obsidian/benchmarking/surveys/fork-audit.md § A
# (audit date 2026-09-05), with the per-fork manifest facts from § B. The
# exceptions are APDe-MVS and TSAR-MVS, added on 2026-09-07 after that audit:
# their facts were read off the pristine forks on that date and are cited
# there. APDe-MVS carries `status: pending` until its own audit lands;
# TSAR-MVS is `excluded` (D30, 2026-09-07).
# Pass vocabularies are from surveys/phase-survey.md § A and § E.6.
# Converter variants and the normalized parameter set are from
# surveys/param-survey.md § C and § E.

version: 1
audit_source: resources/obsidian/benchmarking/surveys/fork-audit.md
audit_date: 2026-09-05


# --------------------------------------------------------------------------
# Canonical vocabularies
# --------------------------------------------------------------------------

# Pass names. Each method's own vocabulary is mapped onto this set in its
# `passes:` block, so that a phase trace tagged `pass=` is comparable across
# methods. `hierarchy` is added to the set proposed in the SPEC because ACMM,
# ACMMP and HPM-MVS++ run a photometric pass that is SEEDED from the upsampled
# coarser level rather than randomly initialised; folding it into
# `photometric` would lose the distinction that the multi-scale schedule is
# about (phase-survey § A).
canonical_passes:
  photometric:     PatchMatch pass without geometric consistency, randomly initialised.
  hierarchy:       Photometric pass seeded from the joint-bilateral-upsampled coarser level.
  prior:           Pass in which a planar / mined prior is built and a further PatchMatch run is issued.
  geometric:       Pass with geometric consistency against neighbour depth maps.
  multi_geometric: Geometric pass using the multi-view (multi_geometry) consistency term.
  mandatory:       Geometric pass with HPM-MVS++'s mandatory-consistency term.
  init:            First-round initialisation pass of a round-based schedule (APD lineage).
  refine:          Re-initialisation pass of a later round of a round-based schedule (APD lineage).

# Phase names, from phase-survey.md § B. Dotted names are children of their
# prefix. `preprocess.*` are emitted by the harness, everything else by the
# in-fork phase timer (see global_deviations: phase-timer instrumentation).
canonical_phases:
  - problem_list
  - scene_scan
  - device_init
  - scale
  - upsample
  - confidence_eval
  - edge_prior
  - image_pass
  - input_load
  - device_upload
  - prior_build
  - patchmatch
  - patchmatch.init
  - patchmatch.propagate
  - patchmatch.finalize
  - patchmatch.readback
  - result_readback
  - depthmap_write
  - depthmap_write.debug
  - fusion
  - fusion.load
  - fusion.consistency
  - output_write
  - preprocess.convert
  - preprocess.mono_depth


# --------------------------------------------------------------------------
# Configurations
# --------------------------------------------------------------------------
#
# Both configurations are run and both are reported; the delta between them is
# itself a result (param-survey § E.i). Neither configuration changes any
# method's algorithm — the normalization here is entirely harness-level
# (converter and neighbour count). Parameter normalization inside the forks is
# explicitly OUT OF SCOPE for this campaign; see param-survey § E.ii/E.iii for
# what it would cost.

configurations:
  author:
    description: >-
      Each method as its authors released it, modulo the recorded fork
      deviations: the fork's own converter (including, for APD-MVS and DPE-MVS,
      its padding and JPEG re-encoding), the shipped neighbour count (20) and
      the shipped parameters. Decision D18 / R-EXP-06.
    converter: own
    neighbours: 20               # the value every shipped converter computes
    parameters: shipped
    debug_output: off            # planned; see global_deviations
  norm10:
    description: >-
      One shared converter for every method, emitting 10 source views per
      reference (the setting the APD-MVS and DVP-MVS papers state) instead of
      the shipped 20; shipped parameters otherwise. Padding, if a scene needs
      it, is applied to every method or to none (R-EXP-09). The author->norm10
      delta is a reported result; it confounds the converter effect
      (param-survey § C) with the view-count effect, which the profiled tier
      separates for ACMM and APD-MVS. Decision D18 / R-EXP-08, R-EXP-10.
    converter: shared            # colmap2mvsnet_acm_perf
    neighbours: 10
    parameters: shipped
    debug_output: off            # planned; see global_deviations

# --------------------------------------------------------------------------
# Deviations that apply to every method
# --------------------------------------------------------------------------

global_deviations:
  - class: build
    status: active
    description: >-
      Docker toolchain. Base image nvidia/cuda:12.8.1-devel-ubuntu24.04; host
      and CUDA-host compiler clang-18 (never the distribution gcc); nvcc from
      /usr/local/cuda-12.8; CMAKE_BUILD_TYPE=Release for every method; Ninja
      generator. Eigen pinned to 3.4.0. OpenCV pinned to 4.12.0 with
      opencv_contrib, built static with
      BUILD_LIST=core,imgcodecs,imgproc,calib3d,cudev,highgui,viz,
      WITH_CUDA=ON, WITH_VTK=ON. PCL comes from Ubuntu's libpcl-dev and is
      linked by HPM-MVS only. None of the thirteen methods was released against
      this toolchain, so no measurement here is a measurement of the authors'
      binaries.
    affects: timing,memory,quality
    reversible: no
    evidence: benchmark/Dockerfile

  - class: build
    status: active
    description: >-
      CUDA architecture target. Passed to every method build as
      -DCMAKE_CUDA_ARCHITECTURES=<arch>. The campaign target is 120 (the
      Blackwell benchmark fleet); the local development GPU is 75. Every
      published number states which. `deviations verify --arch <arch>
      --image <image>` runs `cuobjdump -res-usage` on each built binary inside
      the image and requires the method's own kernels to carry SASS for exactly
      that architecture; the statically linked OpenCV CUDA modules
      (`cv::cudev::…`) ship SASS for sm_50–sm_120 regardless and are only
      checked for covering the target (D22). Upstream's ACMH, ACMM, ACMP, ACMMP, MP-MVS
      and DPE-MVS created their targets with FindCUDA's `cuda_add_executable`,
      which ignores CMAKE_CUDA_ARCHITECTURES and CMAKE_CUDA_FLAGS; every fork
      now builds through enable_language(CUDA) (one `build` commit each, see
      the forks' logs), so the flag is authoritative everywhere and the binary
      check is what keeps that claim honest over time.
    affects: timing,memory,quality
    reversible: flag -DCMAKE_CUDA_ARCHITECTURES
    evidence: fork-audit.md § C.1

  - class: build
    status: active
    description: >-
      Common nvcc flags. The ACM lineage ships
      `-O3 --use_fast_math --maxrregcount=128 --ptxas-options=-v` in
      CUDA_NVCC_FLAGS and the harness keeps them. --use_fast_math changes
      device floating-point semantics and --maxrregcount=128 is an occupancy
      control, so both are load-bearing for runtime and for the numbers. They
      must reach the actual compile path in every fork. The MP-MVS fork had
      moved them to CMAKE_CUDA_FLAGS while its target was still created with
      `cuda_add_executable`, so it was compiled with neither (fork-audit.md
      § B.8 #3c, § C.1); repaired by its `build: build CUDA through the CUDA
      language` commit, verified on the nvcc command line and with cuobjdump.
      No MP-MVS number predates the repair.
    affects: timing,quality
    reversible: no
    evidence: fork-audit.md § C.1

  - class: build
    status: active
    description: >-
      ETH3D evaluator. Scoring runs against the gaborpelesz fork of
      ETH3D/multi-view-evaluation rather than upstream, built
      CMAKE_BUILD_TYPE=Release with MVE_PCL_IO_FALLBACK=ON, MVE_LTO=OFF and
      the fork's MVE_NATIVE_ARCH default (ON). ThinLTO is off because the image
      carries no llvm-ar/llvm-ranlib, so CMake's IPO probe fails and skips it
      silently; the flag is set explicitly so the build stops requesting an
      optimisation it does not receive. Every number below was measured on a
      non-LTO binary. The fork changes only how
      fast the scoring runs: it adds a lean PLY reader in place of PCL's
      general one, parallelises the grid build, and raises -O2 to -O3 with
      ThinLTO, and its own gate hashes the twelve per-point classification
      clouds as well as the four printed result lines. Independently
      re-verified here on six real campaign clouds (6.1M to 40.2M points,
      Quorum MVS / APD-MVS / ACMMP / MP-MVS) at the campaign's own tolerances:
      max absolute difference 0.000e+00 over all 90 cells, 398.4 s to 51.0 s
      end to end; and inside the campaign image on delivery_area at 43.7M
      points, 129.05 s to 14.75 s with every printed digit unchanged. The
      quality of a measurement is therefore unaffected and only the cost of
      taking it moves. That six-cloud check omitted CUMVS, which is the one
      method of the fourteen writing ASCII PLY (F-074) and so the one the lean
      reader declines; MVE_PCL_IO_FALLBACK was OFF, and its four
      outdoor-four-scene runs consequently failed to score. From c703dfb the
      option is ON: fast_ply is still tried first and still serves the nine
      binary-writing methods, and PCL's general reader is reached only for what
      it declines. Two gates were run on this host and image before the switch
      was accepted -- the ON build reproduces all fifteen printed cells of the
      upstream evaluator's stored CUMVS delivery_area scores (f1@2cm 0.859716),
      and matches the OFF build cell for cell on a binary cloud. The first of
      those is also the MVE_NATIVE_ARCH re-gate that the fork's CMakeLists asks
      for on any host whose baseline ISA lacks FMA, which had not been done on
      x86-64 until now. MVE_NATIVE_ARCH=ON means the built layer is valid only
      on the ISA it was compiled on -- the fork's CMakeLists documents that this
      program is not invariant to FMA contraction -- which the campaign's
      hardware-fingerprint binding already enforces. No campaign predating the
      swap needs rescoring, but a campaign must not mix evaluator builds.
    affects: timing
    reversible: no
    evidence: benchmark/Dockerfile; benchmark/eth3d/perf-harness/README.md; F-073 verify block

  - class: normalization
    status: active
    description: >-
      In the `norm10` configuration one shared converter,
      `colmap2mvsnet_acm_perf`, replaces the shipped converter of every method
      and emits 10 source views instead of the shipped 20. View selection is
      byte-identical in all five shipped variants, so the substitution changes
      no neighbour ranking; it equalises the image bytes and intrinsics that
      variants D/E (APD-MVS, DVP-MVS, DPE-MVS) otherwise pad, re-encode and
      rescale. Applies to `norm10` only; `author` runs each fork's own
      converter (R-EXP-06). Padding under `norm10` is all-or-none per scene
      (R-EXP-09).
    affects: quality,timing
    reversible: configuration author
    evidence: param-survey.md § C; decisions D02, D18

  - class: normalization
    status: active
    description: >-
      Debug artefact output disabled in every configuration behind a single
      `--no-debug-output` flag, with the upstream behaviour left as the
      binary's default. Upstream ships debug output ON in seven of the ten
      campaign methods: DPE-MVS's DEBUG_COMPLEX (a full-resolution D2H copy
      plus a JPEG encode per RunPatchMatch) and show_medium_result=true
      (3 JPEGs per image pass, plus 2 per edge pre-pass), APD-MVS's
      show_medium_result forced true in main (3 JPEGs per image pass), MP-MVS's
      four config.yaml switches plus an unconditional costs.jpg per image pass,
      HPM-MVS's depths_prior.dmb per prior pass, HPM-MVS++'s triangulation*.png
      and up to two depths_prior*.dmb per prior pass, and the
      triangulation.png of ACMP, ACMMP and MP-MVS. Every fork's default is the
      upstream behaviour, config.yaml and DPE's #define DEBUG_COMPLEX included;
      the flag only adds a way to skip the writes at run time. ACMH and ACMM
      write no debug artefacts and take no flag; CUMVS writes none unless -d is
      given and its OpenCV CommandLineParser rejects unknown keys, so the flag
      must NOT be passed to it. Per policy rule 1 both settings are measured in
      the pilot so the pair is a result, not just a disclosure.
    affects: timing,io
    reversible: flag --no-debug-output
    evidence: fork-audit.md § B.8 #10b, § B.9 #1d, § C.3; phase-survey.md § E.9

  - class: instrumentation
    status: active
    description: >-
      Phase-timer instrumentation. A single `bench_timer.h` vendored
      byte-identically into all ten campaign forks (md5 must match across
      them), emitting `PHASE <name> BEGIN|END <monotonic_ns> [k=v ...]` for the
      canonical_phases above to the file named by MVS_BENCH_FILE, line
      buffered so a crashed or killed run keeps its partial trace. It is
      compiled out entirely under -DBENCH_PHASES=0 and, when compiled in, takes
      one cached always-false branch per boundary unless MVS_BENCH_PHASES is
      set; output never goes to the binary's own stdout or stderr. Every kernel
      launch in the nine non-CUMVS methods is already followed by
      cudaDeviceSynchronize, so every canonical phase boundary is a true sync
      point and no extra synchronisation is introduced. CUMVS has two
      unsynchronised launches (initializeDepthsAndNormals, calcInitialCosts);
      their cost is attributed to the following patchmatch.propagate span
      unless MVS_BENCH_SYNC is set, which inserts one cudaDeviceSynchronize at
      the end of patchmatch.init and must itself be measured as an on/off pair
      (R-TIM-08). Overhead must be measured (instrumented vs BENCH_PHASES=0
      build), not assumed (R-TIM-09).
    affects: timing
    reversible: flag BENCH_PHASES=0 at compile time; env var at run time
    evidence: phase-survey.md § D

  - class: interface
    status: active
    description: >-
      Dataset presentation. The harness binds an ETH3D scene into the container
      as three read-only mounts: `images/`, `dslr_calibration_undistorted/`,
      and the same calibration directory a second time as `sparse/`. The
      ACM-lineage converters (ACMH, ACMM, ACMP, ACMMP, HPM-MVS, HPM-MVS++,
      MP-MVS) read `<dense_folder>/sparse` as a COLMAP dense workspace would
      have it; APD-MVS, DPE-MVS and CUMVS read `dslr_calibration_undistorted`
      directly. Both see identical bytes; no fork's converter is edited and
      nothing is copied or rewritten. Image paths in images.txt carry the
      `dslr_images_undistorted/` prefix, so `images/<name>` resolves for both.
    affects: none
    reversible: no
    evidence: benchmark/src/bench/runner.py scene_mounts


# --------------------------------------------------------------------------
# Methods
# --------------------------------------------------------------------------

methods:

  - name: ACMH
    path: benchmark/methods/ACMH
    upstream: https://github.com/GhiXu/ACMH
    upstream_default_branch: main
    upstream_base: 7db8c1b21af1dc5990fda066723e87c7e9e59a55
    provenance: published-reference
    paper: acmh_acmm.pdf
    source_subdir: .
    executable: build/ACMH
    invocation: ["{executable}", "{dataset_dir}"]
    converter: colmap2mvsnet_acm.py
    output_ply: ACMH/ACMH_model.ply
    requires_equal_image_sizes: false
    fork_sha: null
    passes:
      photometric: photometric
      geometric: geometric
    known_limitations:
      - >-
        main.cpp:38 calls cudaSetDevice(1). On a single-GPU host this returns
        cudaErrorInvalidDevice, the return value is discarded, and the run
        silently proceeds on device 0. Benign but it makes ACMH's device_init
        semantics differ from every other method. (Inferred from source; not
        verified by running.)
      - >-
        Built through FindCUDA's cuda_add_executable, so
        -DCMAKE_CUDA_ARCHITECTURES is ignored and the binary carries nvcc's
        default architecture rather than the campaign target. Blocking for
        measurement; see global_deviations.
      - Two image passes per image (1 photometric + 1 geometric) - the shortest schedule in the set.
    harness_deviations:
      - class: normalization
        description: "norm10 only: shared colmap2mvsnet_acm_perf instead of the fork's converter; author runs the fork's own."
        reversible: configuration author
        affects: quality
      - class: normalization
        description: "norm10: converter emits 10 source views instead of the shipped 20."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: normalization
        description: >-
          R-EXP-11 (debug artefact output off) needs no action for this method:
          it writes no debug artefacts. The harness must NOT pass
          --no-debug-output to it -- the binary has no such flag.
        reversible: no
        affects: none

  - name: ACMM
    path: benchmark/methods/ACMM
    upstream: https://github.com/GhiXu/ACMM
    upstream_default_branch: master
    upstream_base: e7f34fa56931e026078e4f11bdf53f54dddc9ccc
    provenance: published-reference
    paper: acmh_acmm.pdf
    source_subdir: .
    executable: build/ACMM
    invocation: ["{executable}", "{dataset_dir}"]
    converter: colmap2mvsnet_acm.py
    output_ply: ACMM/ACMM_model.ply
    requires_equal_image_sizes: false
    fork_sha: null
    passes:
      photometric: photometric
      hierarchy: hierarchy
      geom: geometric
      multi-geometry: multi_geometric
    known_limitations:
      - Same FindCUDA / cuda_add_executable architecture defect as ACMH.
      - >-
        Reference structure for the whole survey: 3 scale levels x
        (1 photometric + 2 geometric) = 9 image passes per image, plus 2 joint
        bilateral upsamplings per image, at max_image_size 3200 and stopping
        bound 1000.
    harness_deviations:
      - class: normalization
        description: "norm10 only: shared colmap2mvsnet_acm_perf instead of the fork's converter; author runs the fork's own."
        reversible: configuration author
        affects: quality
      - class: normalization
        description: "norm10: converter emits 10 source views instead of the shipped 20."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: normalization
        description: >-
          R-EXP-11 (debug artefact output off) needs no action for this method:
          it writes no debug artefacts. The harness must NOT pass
          --no-debug-output to it -- the binary has no such flag.
        reversible: no
        affects: none

  - name: ACMP
    path: benchmark/methods/ACMP
    upstream: https://github.com/GhiXu/ACMP
    upstream_default_branch: master
    upstream_base: 574c8e078b6f7bd93237bd180d46f5adf1169a19
    provenance: published-reference
    paper: acmp.pdf
    source_subdir: .
    executable: build/ACMP
    invocation: ["{executable}", "{dataset_dir}", "--no-debug-output"]
    converter: colmap2mvsnet_acm.py
    output_ply: ACMP/ACMP_model.ply
    requires_equal_image_sizes: false
    fork_sha: null
    passes:
      photometric: photometric
      planar_prior: prior
      geom: geometric
      multi-geometry: multi_geometric
    known_limitations:
      - Same FindCUDA / cuda_add_executable architecture defect as ACMH.
      - >-
        upstream_base is GhiXu's merge of community PR #4 (rjanvier: size_t
        formats, an out-of-bounds access, cv::Mat ownership leaks, directory
        permissions 0777 -> 0755). Those fixes are part of the published
        reference, not deviations of this fork, but the fork point therefore
        sits after the paper's release.
      - >-
        Writes triangulation.png once per planar-prior pass; that debug write
        is inside the timed region and is upstream default behaviour.
    harness_deviations:
      - class: normalization
        description: "norm10 only: shared colmap2mvsnet_acm_perf instead of the fork's converter; author runs the fork's own."
        reversible: configuration author
        affects: quality
      - class: normalization
        description: "norm10: converter emits 10 source views instead of the shipped 20."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: normalization
        description: >-
          Debug artefact output disabled in both configurations by passing
          --no-debug-output (R-EXP-11). The fork's own default is the upstream
          behaviour; see global_deviations for what each method writes.
        reversible: flag --no-debug-output
        affects: timing,io

  - name: ACMMP
    path: benchmark/methods/ACMMP
    upstream: https://github.com/GhiXu/ACMMP
    upstream_default_branch: main
    upstream_base: 5b4c5fede90c301d37853d3ea8943fd9e93dcce8
    provenance: published-reference
    paper: acmmp.pdf
    source_subdir: .
    executable: build/ACMMP
    invocation: ["{executable}", "{dataset_dir}", "--no-debug-output"]
    converter: colmap2mvsnet_acm.py
    output_ply: ACMMP/ACMMP_model.ply
    requires_equal_image_sizes: false
    fork_sha: null
    passes:
      photometric: photometric
      hierarchy: hierarchy
      planar_prior: prior
      geom: geometric
      multi-geometry: multi_geometric
    known_limitations:
      - Same FindCUDA / cuda_add_executable architecture defect as ACMH.
      - >-
        upstream_base sits after community PR #7 (zcc, memory-leak fix), which
        is part of the published reference.
      - >-
        Each prior pass issues RunPatchMatch twice, so 9 image passes per image
        correspond to 12 PatchMatch invocations.
      - >-
        Ships one cudaEvent pair around the JBU kernel only, printing "Total
        time needed for computation"; that number covers the upsampling kernel,
        not the run.
      - >-
        CMakeLists.txt:8-17 carries a commented-out
        check_language(CUDA)/enable_language(CUDA) block - the correct fix for
        the architecture defect, left disabled.
    harness_deviations:
      - class: normalization
        description: "norm10 only: shared colmap2mvsnet_acm_perf instead of the fork's converter; author runs the fork's own."
        reversible: configuration author
        affects: quality
      - class: normalization
        description: "norm10: converter emits 10 source views instead of the shipped 20."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: normalization
        description: >-
          Debug artefact output disabled in both configurations by passing
          --no-debug-output (R-EXP-11). The fork's own default is the upstream
          behaviour; see global_deviations for what each method writes.
        reversible: flag --no-debug-output
        affects: timing,io

  - name: APD-MVS
    path: benchmark/methods/APD-MVS
    upstream: https://github.com/whoiszzj/APD-MVS
    upstream_default_branch: master
    upstream_base: 95be7c9bd267969cf11f906367ab56d1f5f85a59
    provenance: published-reference
    paper: adp.pdf
    source_subdir: .
    executable: build/APD
    invocation: ["{executable}", "{dataset_dir}", "--no-debug-output"]
    invocation_optional_args: ["{gpu_index}"]
    converter: colmap2mvsnet.py
    output_ply: APD/APD.ply
    requires_equal_image_sizes: true
    fork_sha: null
    passes:
      FIRST_INIT: init
      REFINE_INIT: refine
      REFINE_ITER: geometric
    known_limitations:
      - >-
        Hard requirement, enforced: CheckImages() aborts unless every image in
        the scene has identical width and height (main.cpp:50-78). Under
        `author` the fork's own converter pads; under `norm10` the campaign
        prefers scenes needing no padding, else pads every method (R-EXP-09).
      - >-
        Round-based schedule with no top-level scale loop: round_num x 4 image
        passes per image (16 at 6048 px). No joint bilateral upsampling.
      - >-
        show_medium_result defaults to true in main.cpp:135 (the field's
        default in main.h:96 is false), so three debug JPEGs are written per
        image pass, inside the timed region. The fork's --no-debug-output
        commit makes that assignment !no_debug_output; the default is still
        true.
      - >-
        Upstream has 4 later README-only commits; no code drift. Not rebased.
      - >-
        MAX_IMAGES = 32 (main.h:31). With 20 neighbours the row length is 21,
        so the cap holds, but it was not verified that no ETH3D scene produces
        a longer pair.txt row.
      - >-
        Fork commit d3043a3 introduced a red/blue channel swap in the emitted
        PLY (header reordered, payload not). Geometry and F1 are unaffected;
        the artefact is wrong. Scheduled to be replaced in the rewrite by a
        header-rename-only interface commit.
      - >-
        CUDA_SEPARABLE_COMPILATION ON was added by the fork and was never
        requested upstream; it inhibits cross-TU device inlining and changes
        register allocation.
    harness_deviations:
      - class: normalization
        description: >-
          norm10 only: shared colmap2mvsnet_acm_perf (with --padding if the
          scene needs it, then for every method) instead of the fork's own
          converter, which pads AND re-encodes AND optionally rescales. author
          runs the fork's own converter.
        reversible: configuration author
        affects: quality
      - class: normalization
        description: >-
          Zero-padding of every image to the scene maximum, required by
          CheckImages(). Applied to this method only, so its input pixels
          differ from the non-padding methods' - a disclosed asymmetry, not an
          equalisation.
        reversible: flag --padding
        affects: quality,timing
      - class: normalization
        description: "norm10: converter emits 10 source views instead of the shipped 20."
        reversible: flag --neighbours=20
        affects: timing,memory,quality
      - class: normalization
        description: >-
          Debug artefact output disabled in both configurations by passing
          --no-debug-output (R-EXP-11). The fork's own default is the upstream
          behaviour; see global_deviations for what each method writes.
        reversible: flag --no-debug-output
        affects: timing,io

  - name: APDe-MVS
    path: benchmark/methods/APDe-MVS
    upstream: https://github.com/whoiszzj/APDe-MVS
    upstream_default_branch: master
    upstream_base: 7c7ce3dda39cf11dbcca11546dabeb95e387c815
    provenance: published-reference
    provenance_note: >-
      The APD-MVS authors' own successor release (Zeng, Wang, Guan, Pattern
      Recognition 172 (2026) 112593, online 2025), not a third-party
      optimization of APD-MVS and not the thesis author's work. Its four
      claimed additions over APD-MVS are a focal weight for the deformable
      PatchMatch, an inconsistency-aware impetus term, a SAM segmentation
      plug-in and a visibility-conflict filter in fusion; the last three are
      switchable at run time (see known_limitations).
    paper: 1-s2.0-S0031320325012567-main.pdf
    status: pending
    reason: >-
      Added to the manifest on 2026-09-07, after the 2026-09-05 fork audit, and
      NOT YET MEASURABLE. The fork now carries four audit commits - c1d000a
      (compat), b187d72 and e437a4d (build), c6b3472 (interface) - which make
      it build on the current toolchain and fix the PLY header, but the
      Dockerfile still does not build it, it carries no phase timer and no
      --no-debug-output flag, and the SAM plug-in question (D29) is open. D28
      was answered on 2026-09-07: measure as shipped, memory_cache on, the flag
      passed explicitly in argv. `bench run` refuses a spec that names a
      `pending` method and `deviations verify --arch` skips it, so nothing in
      the result store can come from this fork until the instrumentation lands
      and the status becomes `active`. Everything below is read off the fork,
      not measured.
    source_subdir: .
    executable: build/APD
    invocation: ["{executable}", "-d", "{dataset_dir}", "--dataset", "ETH3D"]
    invocation_optional_args: ["-g", "{gpu_index}"]
    converter: tools/colmap2mvsnet.py
    output_ply: APD/APD.ply
    requires_equal_image_sizes: true
    fork_sha: null
    passes:
      FIRST_INIT: init
      REFINE_INIT: refine
      REFINE_ITER: geometric
    known_limitations:
      - >-
        BUILD, fixed in the fork by b187d72 (`build`): upstream
        CMakeLists.txt:40 created the target with FindCUDA's
        `cuda_add_executable`, and CMakeLists.txt:51-57 then overwrote
        CUDA_ARCHITECTURES with `CUDA_DETECT_INSTALLED_GPUS`, i.e. with
        whatever GPU the *build host* exposed - so `-DCMAKE_CUDA_ARCHITECTURES`
        was ignored twice over, and in a GPU-less container (an ordinary
        `docker build`) the unquoted fallback list made CMake fail to configure
        at all (F-030). b187d72 builds CUDA through `enable_language(CUDA)` and
        honours CMAKE_CUDA_ARCHITECTURES; e437a4d (`build`) additionally
        requests only the OpenCV components this fork uses and finds Eigen3
        explicitly. Read the upstream defect at `upstream-base`, not at HEAD.
      - >-
        Boost, already satisfied by the image: the fork needs Boost filesystem,
        system and program_options (CMakeLists.txt:17; main.cpp uses
        boost::program_options for its CLI and boost::filesystem throughout),
        and the image already carries Boost 1.83 via libboost-all-dev, which
        libpcl-dev pulls in as a dependency (M-011) - APDe-MVS builds against
        it with no Dockerfile change and no fork-side workaround. The explicit
        `libboost-all-dev` apt line is still advisable in the fleet Dockerfile,
        so that the dependency is declared rather than inherited by accident
        from PCL's dependency graph and silently lost if PCL is ever dropped or
        repackaged. Dropping Boost from the fork, as the APD-MVS fork did, is
        not needed: `<filesystem>` is a drop-in but program_options is not, and
        rewriting the CLI would be an `interface` deviation on the argv the
        campaign records.
      - >-
        COMPAT, fixed in the fork by c1d000a (`compat`): upstream pinned
        `-std=c++11` in both CUDA_NVCC_FLAGS (CMakeLists.txt:26) and
        add_definitions (CMakeLists.txt:30), which OpenCV 4.12 headers reject
        under CUDA 12.8 / clang-18; c1d000a raises the standard to C++17.
        CMAKE_CXX_FLAGS_RELEASE also carries `-march=native`
        (CMakeLists.txt:37), guarded by CMAKE_COMPILER_IS_GNUCXX and therefore
        inert with clang-18 - it must stay inert, a native build is not
        portable across the fleet.
      - >-
        INTERFACE, fixed in the fork by c6b3472 (`interface`): upstream
        ExportPointCloud (APD.cpp:316-331) declared the PLY colour properties
        as `blue`, `green`, `red` and wrote a matching B,G,R payload. Values
        and geometry were self-consistent, but the property names are not the
        standard ones - the same artefact F-023 recorded for APD-MVS, which
        PCL, hence the ETH3D evaluator, does not accept. c6b3472 writes header
        and payload in red-green-blue order, replicating the APD-MVS fork's
        b105b0b. `--export_color 0` remains the alternative and is deliberately
        not used, because it changes the released artefact.
      - >-
        PENDING INSTRUMENTATION: no `bench_timer.h` and no phase spans, so this
        method produces no phase trace. The pass vocabulary above is APD-MVS's
        (FIRST_INIT / REFINE_INIT / REFINE_ITER, main.cpp:313-359) and is
        expected to carry over unchanged - but the span PLACEMENT is not, see
        the synchronisation bullet below.
      - >-
        SYNCHRONISATION, and it is unique in the collection: APD-MVS
        synchronises the whole device after every one of its 25 kernel launches
        per pass (APD-MVS@95be7c9 APD.cu:2386-2494: 16 static
        cudaDeviceSynchronize sites, 26 executed). APDe-MVS issues 26 launches
        back to back and synchronises ONCE, at APD.cu:2731, immediately before
        the three D2H copies; its only other two sync sites sit inside the
        `export_anchor` / `export_reliable_curve` branches, both default false
        (F-036). The phase survey's premise "every launch is followed by a
        sync, so host timestamps are safe" therefore does NOT hold for this
        fork: its phase-timer spans must be placed at RunPatchMatch boundaries
        (where the M-004 canonical spans for the APD lineage already sit), or
        else use the MVS_BENCH_SYNC mechanism built for CUMVS (M-009, D25).
      - >-
        PENDING NORMALIZATION: no `--no-debug-output` flag, and it must cover
        THREE write sites, not one. main.cpp:359 sets show_medium_result on the
        last geometric iteration of every round, so ProcessProblem
        (main.cpp:192-204) writes a depth JPEG, a normal JPEG, a weak PNG and -
        whenever geom_consistency or use_APD is on - a confidence PNG once per
        image per round, inside the timed region. The third site is `skip.png`,
        written once per image by WeakVisFilter (APD.cpp:1026-1036, the
        cv::imwrite at :1035) UNCONDITIONALLY: not behind show_medium_result,
        not behind any flag, and inside fusion rather than inside
        ProcessProblem (F-031). A flag scoped to show_medium_result alone would
        still leave one PNG per image and would make the global_deviations
        debug-output table wrong for this method alone. The two export
        plug-ins, `export_anchor` and `export_curve`, default to false.
      - >-
        Artefact layout differs from APD-MVS in three ways the result store and
        the scratch accounting depend on (F-044): the per-pass intermediates
        are `depths.bin` / `normals.bin`, NOT `.dmb`, so no ACM-family tool can
        read them; `selected_views.bin` is no longer written at all (the D2H
        copy is commented out, APD.cpp:747-748); and there is no post-fusion
        cleanup, where APD-MVS deletes four files (APD-MVS@95be7c9
        main.cpp:220-230, the four remove() calls at :223-226). A
        `confidence.bin` is written in addition whenever geom_consistency or
        use_APD is on. Peak scratch, not final scratch, is the quantity to
        sample for this fork.
      - >-
        `norm10` asymmetry, which the results chapter must state wherever a
        norm10 number for this method appears: WeakVisFilter loops over every
        image of the scene (`src_index < num_images` at APD.cpp:982, with
        num_images = cameras.size() at APD.cpp:971) and never reads pair.txt,
        so `--neighbours=10` changes this method's PatchMatch cost but NOT its
        fusion cost, whereas for every other method it changes both. The same
        loop makes fusion O(N^2) in scene image count, mitigated only by a
        thread pool (APD.cpp:1039-1048) - the only multithreaded fusion in the
        campaign (F-038).
      - >-
        DECIDED (D28, author, 2026-09-07): measure as shipped - `memory_cache`
        ON (`-m 1`), disclosed as such, with no `-m 0` arm. The flag is passed
        explicitly in argv because the binary default (on, main.cpp:16) and the
        authors' own run.py default (off, run.py:19, always passed explicitly
        at run.py:83-93) disagree, so "the default" is not a well-defined
        configuration for this method (F-042). With the cache on, WriteBinMat
        only clones each depth, normal, weak and confidence map into a host-RAM
        map keyed by path and writes nothing to disk unless `--flush 1` is
        given, and ReadBinMat serves a fresh clone out of that map
        (APD.cpp:18-83): the .dmb round trip that dominates ACMM's host I/O
        does not happen here at all, and peak host RSS grows with the whole
        scene instead (F-027). Both facts are disclosed with every number.
      - >-
        OPEN DECISION (D29): `use_sa` defaults to TRUE (main.cpp:17) and the
        SAM masks are read from `<dense_folder>/sa_masks/<id>.bin`
        (APD.cpp:507, 641-651), produced by the fork's own tools/run_SAM.py
        (segment-anything, public vit_h / vit_b / vit_l checkpoints). When the
        folder is absent the binary prints one line and runs on an all-zero
        mask, which is the no-SAM path in the kernels (APD.cu:465, 621) - it
        does not fail. Unlike DVP-MVS (D19-b, F-018) this preprocessing IS
        published and reconstructible, so the method can be measured with SAM
        as a timed `preprocess.sam` phase, or without it via `-s 0` - but never
        by accident. See F-028. Two costs attach to the with-SAM option:
        run_SAM.py fetches the checkpoint with `wget` at run time
        (run_SAM.py:64-77, the call at :76) and the campaign containers have no
        network, so the ViT-H checkpoint would have to be baked into the image
        or mounted; and SAM is inert in round 0 whatever `-s` says, because the
        mask load sits inside `if (params_host.use_APD)` (APD.cpp:614) and
        round 0 forces use_APD = false (main.cpp:312-314, 340-341), so the
        phase share is paid for rounds 1..n only.
      - >-
        Round schedule as in APD-MVS: ComputeRoundNum (main.cpp:129) halves the
        larger image dimension until it is at most 800, then each round runs one
        FIRST_INIT / REFINE_INIT pass plus `geom_iteration = 3`
        (main.cpp:304) REFINE_ITER passes at scale 2^(round_num-1-i) - 12 image
        passes per image at 3200 px, 16 at 6048. The 800 is applied to every
        dataset although the comment on main.cpp:141 says "800 for TAT &
        BlendedMVS & DTU and 1000 for ETH3D"; at 1600, 3200 and 6048 px both
        thresholds yield the same round count, so the discrepancy is inert here.
      - >-
        Hard requirement, enforced: CheckImages() (main.cpp:104-126) returns
        false unless every image in the scene has identical width and height,
        and main exits EXIT_FAILURE with "Images may error, check it!". The same
        constraint as APD-MVS and DPE-MVS (F-007); under `author` the fork's own
        converter pads, under `norm10` the campaign prefers scenes needing no
        padding, else pads every method (R-EXP-09).
      - >-
        `dense_folder` is a NAMED required option (`-d`, main.cpp:10), not
        argv[1] as in APD-MVS, and every switch is a `value<bool>` that needs an
        explicit value (`-m 0`, not `-m`). `--dataset` branches only on `TaT_a`
        and `TaT_i` (geom_factor 0.05 instead of 0.2, and a different fusion
        entry point; main.cpp:277-282, 294-296, 402-407), so `ETH3D` is
        equivalent to the shipped `DTU` default and is passed only to say so
        explicitly.
      - >-
        Its converter, tools/colmap2mvsnet.py, is converter variant D: it pads
        every image to the scene maximum, rescales by `--scale_factor` with
        INTER_NEAREST and re-encodes to JPEG (lines 512-517), and selects
        `num_view = min(20, len(images) - 1)` neighbours by the same
        75th-percentile triangulation-angle score as APD-MVS (lines 335-336,
        465-468). It is not byte-identical to the APD-MVS copy: the file is
        reformatted and it additionally writes
        `<save_folder>/sparse/0/cameras.txt` and `images.txt` with the padded
        dimensions and scaled intrinsics, which the binary never reads.
        `np.asscalar` is already replaced by `.item()` upstream (line 423), so
        this fork needs no F-013 `compat` fix.
      - >-
        `weak_filter` (the visibility-conflict filter) and `use_impetus` (the
        inconsistency-aware impetus) default to TRUE (main.cpp:18-19) and are
        two of the paper's four contributions; leaving them on is the released
        configuration. `export_color` (main.cpp:23) also defaults to true. The
        impetus is two gated call sites on the strong PatchMatch path
        (APD.cu:990-992 and 1406-1408) and is the only one of the four
        additions with a per-pixel cost (F-037), so it is also the one the
        phase table should show.
      - >-
        run.py, the shipped runner, is a multi-GPU / multi-scene scheduler with
        `--memory_cache`, `--no_fuse` / `--only_fuse` and `--resume`. The harness
        invokes the binary directly, as it does for every other method, so
        run.py is documentation of the authors' intended pipeline, not part of
        the measured path - but it is authoritative documentation of intent,
        which is what D28 turned on (F-042).
      - >-
        Fork carries four audit commits on top of upstream master (2026-01-04,
        "Update paper link in README.md"), HEAD c6b3472: c1d000a (`compat`,
        C++11 -> C++17), b187d72 (`build`, CUDA language and
        CMAKE_CUDA_ARCHITECTURES), e437a4d (`build`, OpenCV components and
        Eigen3) and c6b3472 (`interface`, PLY colour order). Upstream still
        carries no tags and no release. Not rebased.
    harness_deviations: []

  - name: HPM-MVS
