# Pilot B, arm 2 of 5 -- the UNINSTRUMENTED half of the phase-timer overhead
# pair (R-TIM-09). Identical to `pilot-b-var.yaml` in every respect except
# `phase_timer: false`, which leaves MVS_BENCH_PHASES unset, so the vendored
# bench_timer.h takes its cached always-false branch at every boundary and
# writes no trace. The binary is the same one: the timer is compiled in under
# BENCH_PHASES=1 in this image, and the pair measures the run-time cost of the
# env-gated branches, not the compile-time cost of the instrumentation.
#
# Compared against repeats 1-3 of `pilot-b-var-dev`. Three repeats against
# three: the power of that comparison is what it is, and the analysis says so.

version: 1
campaign: pilot-b-notimer-dev
image: mvs-bench:sm75

methods: [ACMM, APD-MVS]
repeats: 3

phase_timer: false            # R-TIM-09: the uninstrumented arm; no phases.txt is written
debug_output: "off"
scenes: [delivery_area]       # D20: Pilot A and B scene
widths: [3200]
configurations: [author]

timeout_seconds: 21600        # R-EXP-04, D12
gpu_index: 0
primary_tolerance: 0.02
tolerances: [0.01, 0.02, 0.05, 0.1, 0.2]

# The pinned commit of multi-view-evaluation built into the image (R-QUA-02).
evaluator_sha: 0daa4f4de036d47d37a6ba054c51fd66642ef896

# R-EXP-03: bind the campaign to the first machine that starts it.
fingerprint: {}

paths:
  dataset_root: /mnt/samsung2tb/eth3d
  results_root: /data/bench/results
  work_root: /data/bench/work
  artifacts_root: /data/bench/clouds
