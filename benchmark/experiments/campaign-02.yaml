# campaign-02 -- the six mixed-size ETH3D training scenes (D32), the
# complement of campaign-01's seven uniform-size ones; together they are all
# thirteen.
#
# Ten methods x six scenes x {1600, 3200} x {author, norm10} x two repeats
# (D31) = 480 runs, on the same card, image, driver and clock lock as
# campaign-01, so that the two campaigns share one hardware fingerprint.
#
# Frozen by construction, like campaign-01: `store.init_campaign` compares this
# file byte for byte against the copy in the campaign directory, R-ENV-06
# refuses a different GPU model, driver, CUDA version or image digest, and the
# image may not be rebuilt while the campaign is open. Quorum MVS work happens
# in a separate clone for the same reason as before.
#
# Methods: identical to campaign-01 (APDe-MVS pending; TSAR-MVS and DVP-MVS
# excluded; Quorum MVS measured through its own campaign).
#
# Image sizes (D32, D33). Each of these scenes was shot with several camera
# settings and ETH3D undistorts each to its own crop (F-021). After
# prepare_scene.py every image of a scene has the target width and heights
# that differ by 1-6 px. The author's rule: each method's converter handles
# that as its authors' pipeline does.
#   - `author`: every fork's own converter. APD-MVS and DPE-MVS zero-pad to
#     the scene maximum (F-006), because their binaries refuse unequal sizes
#     (F-007); the ACM family, the HPM pair and MP-MVS run the sizes as they
#     are; CUMVS's initializer reads the raw scene.
#   - `norm10`: the shared converter, with `padding: required` -- it pads
#     exactly the methods whose `requires_equal_image_sizes` is true (APD-MVS,
#     DPE-MVS), the same zero-padding at the bottom/right, so `author` and
#     `norm10` give every method the same kind of input and the
#     author->norm10 delta still isolates the neighbour count. Whether a run
#     was padded is in its recorded `preprocess_argv` and its in-force
#     normalizations.
# Runs here are therefore not poolable with campaign-01's without stating that
# APD-MVS and DPE-MVS saw padded input on these scenes.
#
# HPM-MVS++ at 3200 ran out of memory on every campaign-01 scene with 31 or
# more images, in both configurations (F-025 addendum); all six scenes here
# have 23-76 images, so most of its 3200 cells are expected to fail. Failures
# are results (R-FAIL-01).
#
# Platform, display and clocks: as campaign-01 -- card 0 of gabor-dev0 (RTX
# 5070 12 GB, driver 595.91.07 / CUDA 13.2), headless, persistence on, SM
# clock locked at 2700 MHz (reads back as 2692) at the stock 250 W limit (D25,
# D26).

version: 1
campaign: campaign-02
image: mvs-bench:sm120

methods:
  - ACMH
  - ACMM
  - ACMP
  - ACMMP
  - APD-MVS
  - HPM-MVS
  - HPM-MVS_plusplus
  - MP-MVS
  - DPE-MVS
  - CUMVS
scenes: [courtyard, electro, facade, playground, terrace, terrains]

# R-EXP-09/D33: mixed-size scenes, so no equal-size assertion; `expand()` reads
# the prepared scenes and `padding: required` is what lets APD-MVS and DPE-MVS
# run under the shared converter. Prepared by eth3d/prepare_scene.py from the
# 2026-09-29 download (HAMMING resampling, JPEG q100 4:4:4), as campaign-01.
padding: required
widths: [1600, 3200]
configurations: [author, norm10]
repeats: 2

# The campaign settings, written out rather than left to the defaults they
# happen to match: the phase timer on (R-TIM-09 instrumented arm) and the debug
# artefacts off (R-EXP-11 in force). `method_env` stays empty — MVS_BENCH_SYNC
# is read by every fork's vendored bench_timer.h, not only by CUMVS, so the
# D25 addendum for CUMVS cannot be served by a campaign-wide variable; it is
# `method_env_by_method` instead, disclosed as a CUMVS harness deviation in
# methods.yaml (author, 2026-09-29).
phase_timer: true
debug_output: "off"
method_env: {}
method_env_by_method:
  CUMVS:
    MVS_BENCH_SYNC: "1"

timeout_seconds: 21600        # R-EXP-04, D12
gpu_index: 0
primary_tolerance: 0.02
tolerances: [0.01, 0.02, 0.05, 0.1, 0.2]

# The pinned commit of multi-view-evaluation built into the image (R-QUA-02).
# c703dfb is the MVE_PCL_IO_FALLBACK=ON build, which is what makes CUMVS's
# ASCII clouds scoreable at all (F-074).
evaluator_sha: c703dfba4ce3fd91ed740d55bc9b24be8030c4e0

# R-EXP-03: refuse the wrong machine before the first container starts, rather
# than binding to whichever host runs first.
fingerprint:
  gpu_model: "NVIDIA GeForce RTX 5070"
  driver_version: "595.91.07"
  cuda_version: "13.2"

# All benchmark data lives under the repository's git-ignored `.data/`.
paths:
  dataset_root: /home/gabor/thesis/.data/eth3d
  results_root: /home/gabor/thesis/.data/bench/results
  work_root: /home/gabor/thesis/.data/bench/work
  artifacts_root: /home/gabor/thesis/.data/bench/clouds
