# Quorum MVS v1 -- the thesis author's own method (`provenance: own`; not a
# fork, and not CUMVS, which is a third-party optimization) at commit
# 1f4c3bff43168312276682f8fc1b095900ed581a (1f4c3bf, 2026-09-15), its FIRST
# measured version (author, 2026-10-04). A later version is measured as
# quorum-v2-*, never by editing these files. Every run record carries the
# commit as `fork_sha`.
#
# This file is campaign-02.yaml with exactly two changes: `campaign:` and `methods:`
# (and CUMVS's `method_env_by_method`, which names a method no longer in the
# list). Everything else -- scenes, widths, configurations, repeats, padding,
# timeout, tolerances, evaluator, fingerprint, card, paths -- is identical, so
# the runs are comparable with that campaign's ten baselines cell for cell. No
# image rebuild: mvs-bench:sm120 (39de44d2...) already contains quorum-mvs
# built for sm_120 at 1f4c3bf, clean, matching the superproject gitlink.
#
# Quorum MVS does not require equal image sizes, so the padding setting never
# applies to it. Platform, display and clocks as campaign-01 (card 0 of
# gabor-dev0, RTX 5070 12 GB, 2700 MHz locked, read back as 2692, stock
# 250 W). Failures, including out-of-memory at 3200, are results (R-FAIL-01).

# Six mixed-size scenes x {1600, 3200} x {author, norm10} x 2 = 48 runs.

version: 1
campaign: quorum-v1-campaign-02
image: mvs-bench:sm120

methods:
  - quorum-mvs
scenes: [courtyard, electro, facade, playground, terrace, terrains]

# R-EXP-09/D33: mixed-size scenes, so no equal-size assertion; `expand()` reads
# the prepared scenes and `padding: required` is what lets APD-MVS and DPE-MVS
# run under the shared converter. Prepared by eth3d/prepare_scene.py from the
# 2026-09-29 download (HAMMING resampling, JPEG q100 4:4:4), as campaign-01.
padding: required
widths: [1600, 3200]
configurations: [author, norm10]
repeats: 2

# The campaign settings, written out rather than left to the defaults they
# happen to match: the phase timer on (R-TIM-09 instrumented arm) and the debug
# artefacts off (R-EXP-11 in force). `method_env` stays empty — MVS_BENCH_SYNC
# is read by every fork's vendored bench_timer.h, not only by CUMVS, so the
# D25 addendum for CUMVS cannot be served by a campaign-wide variable; it is
# `method_env_by_method` instead; CUMVS is not in this campaign, so it is absent.
phase_timer: true
debug_output: "off"
method_env: {}

timeout_seconds: 21600        # R-EXP-04, D12
gpu_index: 0
primary_tolerance: 0.02
tolerances: [0.01, 0.02, 0.05, 0.1, 0.2]

# The pinned commit of multi-view-evaluation built into the image (R-QUA-02).
# c703dfb is the MVE_PCL_IO_FALLBACK=ON build, which is what makes CUMVS's
# ASCII clouds scoreable at all (F-074).
evaluator_sha: c703dfba4ce3fd91ed740d55bc9b24be8030c4e0

# R-EXP-03: refuse the wrong machine before the first container starts, rather
# than binding to whichever host runs first.
fingerprint:
  gpu_model: "NVIDIA GeForce RTX 5070"
  driver_version: "595.91.07"
  cuda_version: "13.2"

# All benchmark data lives under the repository's git-ignored `.data/`.
paths:
  dataset_root: /home/gabor/thesis/.data/eth3d
  results_root: /home/gabor/thesis/.data/bench/results
  work_root: /home/gabor/thesis/.data/bench/work
  artifacts_root: /home/gabor/thesis/.data/bench/clouds
