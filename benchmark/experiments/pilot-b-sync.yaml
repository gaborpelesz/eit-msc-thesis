# Pilot B, arm 4 of 5 -- MVS_BENCH_SYNC ON for CUMVS (R-TIM-08).
#
# CUMVS is the THIRD-PARTY OPTIMIZATION of the ACM family
# (cuda-multi-view-stereo, Fixstars). It is NOT the thesis author's work; it
# is prior art cited as evidence that optimization headroom exists.
#
# It is the only method in the set with unsynchronised kernel launches
# (initializeDepthsAndNormals, calcInitialCosts). Without the env var their
# cost lands in the following patchmatch.propagate span; with it, one
# cudaDeviceSynchronize closes patchmatch.init and the attribution moves. The
# synchronisation is itself a cost, so the pair has to be measured, not
# assumed (global_deviations: phase-timer instrumentation).
#
# The off arm is `pilot-b-cumvs.yaml`.

version: 1
campaign: pilot-b-sync-dev
image: mvs-bench:sm75

methods: [CUMVS]
repeats: 3

phase_timer: true
debug_output: "off"           # CUMVS takes no --no-debug-output; the setting does not apply
method_env:
  MVS_BENCH_SYNC: "1"
scenes: [delivery_area]       # D20: Pilot A and B scene
widths: [3200]
configurations: [author]

timeout_seconds: 21600        # R-EXP-04, D12
gpu_index: 0
primary_tolerance: 0.02
tolerances: [0.01, 0.02, 0.05, 0.1, 0.2]

# The pinned commit of multi-view-evaluation built into the image (R-QUA-02).
evaluator_sha: 0daa4f4de036d47d37a6ba054c51fd66642ef896

# R-EXP-03: bind the campaign to the first machine that starts it.
fingerprint: {}

paths:
  dataset_root: /mnt/samsung2tb/eth3d
  results_root: /data/bench/results
  work_root: /data/bench/work
  artifacts_root: /data/bench/clouds
