name: Build LaTeX document
on:
  push:
    paths:
      - 'thesis/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'thesis/**'
      - '.github/workflows/ci.yml'
jobs:
  build_latex:
    strategy:
      matrix:
        engine: [pdflatex, lualatex]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        # Submodules are deliberately not checked out: resources/papers is a
        # private repository and would fail for forks and for the default token.
        uses: actions/checkout@v4
      - if: ${{ matrix.engine == 'pdflatex' }}
        name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: thesis
          root_file: |
            my_thesis.tex
            elteikthesis_minted.tex
          latexmk_shell_escape: true
      - if: ${{ matrix.engine == 'lualatex' }}
        name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: thesis
          root_file: |
            my_thesis.tex
            elteikthesis_minted.tex
          latexmk_shell_escape: true
          latexmk_use_lualatex: true
      - name: Upload the compiled pdf
        uses: actions/upload-artifact@v4
        with:
          name: thesis-${{ matrix.engine }}
          path: |
            thesis/my_thesis.pdf
            thesis/elteikthesis_minted.pdf
          if-no-files-found: error
