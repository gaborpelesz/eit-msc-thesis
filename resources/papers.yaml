# Manifest for the resources/papers submodule.
#
# That submodule is private, because `version: publisher` entries below are
# publisher versions of record and may not be redistributed. This manifest
# lives in the public repository so the bibliography stays reproducible: every
# source can be retrieved from the identifier given here without access to the
# submodule.
#
# Identifiers were read out of the PDFs themselves where embedded, and verified
# against the publisher or CVF open-access record otherwise.

